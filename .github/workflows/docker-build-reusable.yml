name: Docker Build (Reusable)

# Enthält die eigentlichen Build-Jobs (Qualitäts-Gate + Docker Build & Push).
# Wird ausschließlich von docker.yml (Self-Hosted-Runner) und
# docker-cloud.yml (Cloud-Runner-Fallback) über `uses:` aufgerufen — der
# Runner wird dabei als Input durchgereicht, der restliche Ablauf ist
# für beide identisch.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner-Label für alle Jobs (z.B. self-hosted oder ubuntu-latest)"
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # merlin2533/kundefutter

jobs:
  quality:
    name: Lint, Typecheck & Tests
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # TODO: 46 Dateien haben aktuell bestehende Lint-Fehler (v.a. no-require-imports
        # in CJS-Scripts unter prisma/scripts, react-hooks-Regeln in mehreren page.tsx).
        # Non-blocking bis diese in einer eigenen Aufräum-Phase behoben sind, damit das
        # Qualitäts-Gate den Deploy nicht sofort blockiert.
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Report failure to Sentry
        if: failure()
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: .github/scripts/report-to-sentry.sh "quality"

  build-and-push:
    needs: quality             # Docker-Build läuft nur, wenn Qualitäts-Gate grün ist
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write        # nötig für ghcr.io push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatisch vorhanden, keine Konfiguration nötig

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/${{ secrets.DOCKER_USERNAME }}/kundefutter
          tags: |
            # latest immer
            type=raw,value=latest
            # Versions-Tag z.B. v1.2.3 → 1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Kurzer Commit-Hash immer
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Kein NEXT_PUBLIC_SENTRY_DSN-Build-Arg mehr: der Standard-DSN ist in
          # lib/sentry-dsn.ts fest hinterlegt und wird beim Build automatisch ins
          # Client-Bundle eingebacken. Würde hier ein (womöglich veraltetes)
          # SENTRY_DSN-Secret übergeben, meldete der Browser des offiziellen
          # Images an ein anderes Projekt als der Server. Das ARG im Dockerfile
          # bleibt als dokumentierter Notausgang für eigene Builds bestehen.
          no-cache: true                # GitHub Actions Cache deaktiviert

      - name: Image digest
        run: echo "Image pushed → ${{ steps.meta.outputs.tags }}"

      - name: Package öffentlich schalten
        # Macht das ghcr.io-Package nach dem ersten Push automatisch public.
        # Funktioniert nur wenn das GitHub-Repo bereits public ist.
        run: |
          PACKAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PACKAGE_NAME}" \
            -d '{"visibility":"public"}' || true
          echo "Package visibility set to public"

      - name: Report failure to Sentry
        if: failure()
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: .github/scripts/report-to-sentry.sh "build-and-push"
