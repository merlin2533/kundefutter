name: Build & Push Docker Image (Self-Hosted)

# Standard-Weg: läuft auf dem Self-Hosted-Runner.
# - automatisch bei Push auf main / Versions-Tag
# - jederzeit manuell über "Run workflow" (workflow_dispatch)
#
# Fällt der Self-Hosted-Runner aus (z.B. wenn ein PR nach main gemerged
# werden muss und der Build sofort raus soll), gibt es als Ausweichlösung
# docker-cloud.yml — der läuft auf einem GitHub-gehosteten Cloud-Runner,
# aber ausschließlich manuell.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:        # Manueller Trigger jederzeit möglich

jobs:
  build:
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      runner: self-hosted
    secrets: inherit
