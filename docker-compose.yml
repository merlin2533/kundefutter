# ── Entwicklung (lokal bauen) ──────────────────────────────────────────────────
# docker compose up --build
services:
  kundefutter:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - kundefutter_data:/data
      - kundefutter_uploads:/app/public/uploads
    environment:
      - DATABASE_URL=file:/data/kundefutter.db
      - NODE_ENV=production
      # Optional: das Image hat einen fest hinterlegten Standard-DSN
      # (lib/sentry-dsn.ts). Nur setzen, um auf ein eigenes GlitchTip-Projekt
      # umzulenken — oder auf "off", um das Reporting lokal abzuschalten.
      - SENTRY_DSN=${SENTRY_DSN:-}
    restart: unless-stopped

volumes:
  kundefutter_data:
  kundefutter_uploads:
